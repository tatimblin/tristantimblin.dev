<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <!-- A trace of tool calls: a circuit stepping down from the left edge, each
       call a green checkbox, until the one assertion that fails, lit coral
       and blinking. The untaken rest of the trace runs off the bottom, dashed.
       A dim assertion grid crops the top-right corner. -->
  <g>
    <path d="M 230 10 H 330 M 230 30 H 330 M 230 50 H 330 M 230 -10 V 50 M 250 -10 V 50 M 270 -10 V 50 M 290 -10 V 50 M 310 -10 V 50" fill="none" stroke="var(--art-ink-2)" class="art-line" vector-effect="non-scaling-stroke" />
    <rect x="235" y="15" width="10" height="10" rx="2" fill="var(--art-green)" />
    <rect x="255" y="-5" width="10" height="10" rx="2" fill="var(--art-green)" />
    <rect x="275" y="15" width="10" height="10" rx="2" fill="var(--art-green)" />
    <rect x="295" y="35" width="10" height="10" rx="2" fill="none" stroke="var(--art-ink)" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M -10 40 H 70 A 10 10 0 0 1 80 50 V 60 A 10 10 0 0 0 90 70 H 140 A 10 10 0 0 1 150 80 V 90 A 10 10 0 0 0 160 100 H 210 A 10 10 0 0 1 220 110 V 120 A 10 10 0 0 0 230 130 H 238" fill="none" stroke="var(--art-ink)" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M 262 130 H 290 A 10 10 0 0 1 300 140 V 190" fill="none" stroke="var(--art-ink-2)" stroke-dasharray="4 4" class="art-line" vector-effect="non-scaling-stroke" />
    <rect x="31" y="31" width="18" height="18" rx="2" fill="var(--art-green)" />
    <rect x="106" y="61" width="18" height="18" rx="2" fill="var(--art-green)" />
    <rect x="176" y="91" width="18" height="18" rx="2" fill="var(--art-green)" />
    <path d="M 35 40 L 38.5 43.5 L 45 36.5 M 110 70 L 113.5 73.5 L 120 66.5 M 180 100 L 183.5 103.5 L 190 96.5" fill="none" stroke="var(--art-ink)" stroke-linecap="round" stroke-linejoin="round" class="art-line" vector-effect="non-scaling-stroke" />
    <rect x="230" y="110" width="40" height="40" rx="4" fill="none" stroke="var(--art-ink)" class="art-line--2" vector-effect="non-scaling-stroke" />
    <circle cx="20" cy="110" r="1.5" fill="var(--art-ink)" />
    <circle cx="60" cy="150" r="2" fill="var(--art-ink)" />
  </g>
  <g data-motion="blink">
    <rect x="238" y="118" width="24" height="24" rx="2" fill="var(--art-coral)" />
    <path d="M 244.5 124.5 L 255.5 135.5 M 255.5 124.5 L 244.5 135.5" fill="none" stroke="var(--art-ink)" stroke-linecap="round" class="art-line" vector-effect="non-scaling-stroke" />
  </g>
</svg>
