<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <g>
    <!-- Three identical dashboards cascading in from the top-left corner.
         The back two are only their visible edges, each with the same header:
         three chrome dots and a coral badge. -->
    <path d="M 10 70 H -10 V 10 H 80 V 30" fill="none" stroke="var(--art-ink-2)" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M -10 30 H 10 M 10 50 H 30" fill="none" stroke="var(--art-ink-2)" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M 30 90 H 10 V 30 H 100 V 50" fill="none" stroke="var(--art-ink)" class="art-line" vector-effect="non-scaling-stroke" />
    <rect x="30" y="50" width="90" height="60" fill="none" stroke="var(--art-ink)" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M 30 70 H 120 M 30 90 H 120 M 60 70 V 110 M 90 70 V 110" fill="none" stroke="var(--art-ink-2)" class="art-line" vector-effect="non-scaling-stroke" />
    <circle cx="-1" cy="20" r="1.5" fill="var(--art-ink)" />
    <circle cx="5" cy="20" r="1.5" fill="var(--art-ink)" />
    <circle cx="11" cy="20" r="1.5" fill="var(--art-ink)" />
    <circle cx="19" cy="40" r="1.5" fill="var(--art-ink)" />
    <circle cx="25" cy="40" r="1.5" fill="var(--art-ink)" />
    <circle cx="31" cy="40" r="1.5" fill="var(--art-ink)" />
    <circle cx="39" cy="60" r="1.5" fill="var(--art-ink)" />
    <circle cx="45" cy="60" r="1.5" fill="var(--art-ink)" />
    <circle cx="51" cy="60" r="1.5" fill="var(--art-ink)" />
    <rect x="62" y="16" width="8" height="8" fill="var(--art-coral)" />
    <rect x="82" y="36" width="8" height="8" fill="var(--art-coral)" />
    <rect x="102" y="56" width="8" height="8" fill="var(--art-coral)" />
    <!-- The front dashboard's widgets: bars, a status pip, a sparkline, a gauge. -->
    <path d="M 36 88 V 80 H 40 V 88 Z M 43 88 V 76 H 47 V 88 Z M 50 88 V 82 H 54 V 88 Z" fill="var(--art-ink)" />
    <circle cx="75" cy="80" r="4" fill="var(--art-coral)" />
    <path d="M 94 86 L 100 80 L 106 84 L 116 74" fill="none" stroke="var(--art-ink)" stroke-linecap="round" stroke-linejoin="round" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M 36 104 A 9 9 0 0 1 54 104" fill="none" stroke="var(--art-ink)" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M 45 104 L 50 98" fill="none" stroke="var(--art-ink)" stroke-linecap="round" class="art-line" vector-effect="non-scaling-stroke" />

    <!-- The editor, cropped large off the right and bottom: cyan chrome with
         the tab + editor area and the terminal cut through to the plate. -->
    <path d="M 150 40 H 340 V 200 H 150 Z M 190 60 V 46 H 230 V 60 H 340 V 140 H 190 Z M 190 150 H 340 V 200 H 190 Z M 154 86 H 186 V 94 H 154 Z" fill="var(--art-cyan)" fill-rule="evenodd" />
    <path d="M 236 60 V 48 H 272 V 60" fill="none" stroke="var(--art-ink)" class="art-line" vector-effect="non-scaling-stroke" />
    <!-- The sidebar tree: a list of cars, one selected. -->
    <path d="M 158 70 H 176 M 164 80 H 180 M 164 100 H 176 M 158 110 H 174 M 164 120 H 180" fill="none" stroke="var(--art-ink)" stroke-linecap="round" class="art-line" vector-effect="non-scaling-stroke" />
    <!-- Code: the digital twin as a document. -->
    <path d="M 200 72 H 240 M 206 82 H 260 M 212 92 H 236 M 212 102 H 250 M 206 112 H 228 M 200 122 H 216" fill="none" stroke="var(--art-ink)" stroke-linecap="round" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M 244 72 H 270 M 240 92 H 290 M 232 112 H 300" fill="none" stroke="var(--art-ink-2)" stroke-linecap="round" class="art-line" vector-effect="non-scaling-stroke" />
    <!-- The terminal: a prompt, and signals tailing past the edge. -->
    <path d="M 198 160 L 203 164 L 198 168" fill="none" stroke="var(--art-ink)" stroke-linecap="round" stroke-linejoin="round" class="art-line" vector-effect="non-scaling-stroke" />
    <path d="M 210 164 H 340 M 198 178 H 340" fill="none" stroke="var(--art-ink-2)" stroke-dasharray="2 6" stroke-linecap="round" class="art-line" vector-effect="non-scaling-stroke" />
    <!-- The hand, on the selected car. -->
    <path d="M 176 90 V 106 L 180 102.5 L 183 109 L 185.5 108 L 182.5 101.5 H 188 Z" fill="var(--art-ink)" />

    <circle cx="40" cy="140" r="2" fill="var(--art-ink)" />
    <circle cx="90" cy="156" r="1.5" fill="var(--art-ink)" />
    <circle cx="120" cy="134" r="2.5" fill="var(--art-coral)" />
  </g>
  <!-- The caret: the editor is already open, live. -->
  <g data-motion="blink">
    <rect x="253" y="96" width="3" height="12" fill="var(--art-ink)" />
  </g>
</svg>
