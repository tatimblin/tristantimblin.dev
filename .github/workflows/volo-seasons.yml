name: Volo Seasons Collection

on:
  schedule:
    # Wednesday and Thursday at 14:00 UTC (~7 AM Pacific). Every game so far
    # has been on a Tuesday evening Pacific (≈ Wednesday 05:00 UTC at the
    # latest), so Wednesday picks up the night's results. Thursday is the
    # backstop: it catches scores a captain entered late, retries a run that
    # failed on Wednesday, and covers a Wednesday league. A run that finds no
    # change commits nothing.
    - cron: '0 14 * * 3,4'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required to commit and push the refreshed JSON

jobs:
  collect-seasons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trades VOLO_REFRESH_TOKEN for a short-lived access token, then pulls every
      # season's schedule and scores from Volo's Hasura API and writes
      # src/widgets/volo/volo.json. The script exits non-zero if no season has a
      # single recorded result (stale-auth guard, since scores are PLAYER-only),
      # so a broken credential never commits an empty widget.
      - name: Fetch Volo seasons
        run: bun tools/volo/fetch.mjs
        env:
          VOLO_REFRESH_TOKEN: ${{ secrets.VOLO_REFRESH_TOKEN }}
          VOLO_ROTATED_TOKEN_FILE: ${{ runner.temp }}/volo-rotated

      # Volo rotates the refresh token on every use (verified), so the secret must
      # be replaced or tomorrow's run authenticates with a dead credential. The
      # fetch script only writes this file when the returned token differs from
      # the one sent. `if: always()` because the rotation happens before the data
      # query — a token that rotated must be persisted even if the query then
      # failed, or the rotation is lost and the account is stranded.
      # The file check is in the script, not the `if:` — hashFiles() only sees
      # the workspace, so a runner.temp path always hashed to '' and this step
      # was skipped on every run, throwing each rotation away.
      - name: Persist rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -s "$RUNNER_TEMP/volo-rotated" ]; then
            echo "Refresh token did not rotate — nothing to persist."
            exit 0
          fi
          gh secret set VOLO_REFRESH_TOKEN --body "$(cat "$RUNNER_TEMP/volo-rotated")"
          rm -f "$RUNNER_TEMP/volo-rotated"

      - name: Commit if changed
        run: |
          # -I ignores the `updated` stamp, which the fetch rewrites on every run:
          # a diff that touches only it is not new data, and committing it would
          # trigger a full deploy for nothing.
          if git diff --quiet -I'^[[:space:]]*"updated": ' -- src/widgets/volo/volo.json; then
            echo "No change to volo.json beyond the timestamp — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/widgets/volo/volo.json
          git commit -m "Update Volo seasons - $(date +'%Y-%m-%d')"
          git push
