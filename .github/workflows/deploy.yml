name: Deploy site to Cloudflare Pages

# What runs when:
#   pull_request        → unit tests, full Playwright suite (Chromium + the Firefox
#                         spec), then the perf budgets. Never deploys.
#   push to master      → code changed: unit tests, Chromium suite, perf budgets,
#                         then build + smoke + deploy.
#                         only content/data changed: build + smoke + deploy, no suite.
#   workflow_dispatch   → as a master push with code changes.
# The nightly data refresh (nightly.yml) pushes with GITHUB_TOKEN, which does NOT
# trigger this workflow; it calls build-deploy.yml itself.
on:
  push:
    branches: ["master"]
  # Also on PRs, so the test gate below runs BEFORE a merge rather than after it
  # (the deploy job is master-only — see its `if` — so this never publishes).
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# One run per ref at a time. A new push to a PR supersedes its own run; master
# runs queue. The deploy job also holds its own repo-wide group (build-deploy.yml).
concurrency:
  group: "cloudflare-pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a master push touched code. Only push events are filtered:
  # PRs and manual runs always get the suite.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v5

      # `every`: a file counts as code only if it matches ALL patterns, i.e. it is
      # not excluded by any `!` line. So `code` is true when at least one changed
      # file is outside the content/docs/data set. (Nightly data commits never
      # reach here: they're pushed with GITHUB_TOKEN and deployed by nightly.yml;
      # the src/data line covers hand edits to the widget data and manifests.)
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!src/content/**'
              - '!src/data/**'
              - '!**/*.md'

  # Layout invariants that only a real engine can confirm — chiefly the mobile hero
  # fold, where the heading group and the scene's bottom UI are in separate
  # coordinate systems and nothing in flow reserves space between them
  # (tests/hero-fold.spec.ts). Gates the deploy.
  test:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Firefox runs one spec (scroll-fallback, see playwright.config.ts), and only
    # on PRs: a master push has already passed it there. Master runs Chromium only.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Includes the CSS lint: no widget or theme CSS animates a geometry property
      # (tools/lint/composited.test.ts).
      - name: Run unit tests
        run: bun run test:unit

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps ${{ github.event_name == 'pull_request' && 'chromium firefox' || 'chromium' }}

      # The Playwright config builds the site and serves it with `astro preview`.
      - name: Run layout tests
        run: bun run test --project=chromium ${{ github.event_name == 'pull_request' && '--project=firefox' || '' }}

      # The performance budgets (tests/perf, numbers in tests/perf/budgets.ts):
      # their own step, so their one worker has the runner to itself. Chromium.
      - name: Run performance budgets
        run: bun run test --project=perf

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: [changes, test]
    # Publish only from master (never on a PR). `test` is skipped for a
    # content/data-only push, so a skip counts as a pass; a failure does not.
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/master'
      && needs.changes.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
