name: Deploy site to Cloudflare Pages

on:
  push:
    branches: ["master"]
  # Also on PRs, so the test gate below runs BEFORE a merge rather than after it
  # (the deploy job is master-only — see its `if` — so this never publishes).
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# Allow one deployment at a time; let an in-progress deploy finish so a live
# deploy is never interrupted. Keyed by ref so a PR's test-only run shares no
# queue with a master deploy — and a new push to a PR supersedes its own run.
concurrency:
  group: "cloudflare-pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Layout invariants that only a real engine can confirm — chiefly the mobile hero
  # fold, where the heading group and the scene's bottom UI are in separate
  # coordinate systems and nothing in flow reserves space between them
  # (tests/hero-fold.spec.ts). Gates the deploy.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      # The Playwright config builds the site and serves it with `astro preview`.
      - name: Run layout tests
        run: bun run test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    # Publish only from master. On a PR the workflow runs solely to gate on `test`.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Pull the actual video/audio bytes (stored in Git LFS), not the
          # pointer files — otherwise the build ships broken media.
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tristantimblin --branch=master
