name: Nightly data refresh

# Replaces the four per-widget crons (baywheels-stats, github-stats, readers,
# volo-seasons); readers is now GoatCounter's pageviews fetch. Every fetcher runs as its own step and may fail without stopping
# the others; whatever changed lands as ONE commit, followed by ONE deploy with no
# Playwright suite.
#
# Why the commit does not trigger deploy.yml: the repo is checked out with the
# default GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do not start other
# workflows. This workflow calls build-deploy.yml itself instead, so a data
# commit deploys exactly once. (GH_PAT is still handed to the steps that used it:
# private-repo checkout, the GitHub stats query and the secret rotations.)
on:
  schedule:
    # Daily at 14:00 UTC (~7 AM Pacific). This is Volo's old slot: it needs to
    # run after Tuesday-evening Pacific games (≈ Wednesday 05:00 UTC at the
    # latest) have scores. The other three never cared about the hour, only
    # about running daily.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      pageviews_since:
        description: "Pageviews: re-read GoatCounter from this date (YYYY-MM-DD) instead of the 45-day window"
        required: false
        default: ""

concurrency:
  group: nightly-data
  cancel-in-progress: false

# The files the fetchers write.
env:
  DATA_BIKE: src/data/bike-stats.csv
  DATA_GITHUB: src/data/github.json
  DATA_PAGEVIEWS: src/data/pageviews.json
  DATA_VOLO: src/data/volo.json
  DATA_AMC: src/data/amc.json
  DATA_AMC_FILMS: src/data/amc-films.json

jobs:
  # ── AMC gate ─────────────────────────────────────────────────────────────
  # A lightweight job on ubuntu-latest that decides whether the self-hosted
  # runner needs to wake up. Without this, a skipped-but-queued amc-fetch job
  # would block the collect job for up to 24h if the runner is offline.
  amc-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: "AMC: is today a fetch day?"
        id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          DOW="$(date -u +%u)"
          if [ "$FORCE" = "true" ] || [ "$DOW" = 1 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Day $DOW is not Monday; skipping AMC."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ── AMC fetch (self-hosted runner) ───────────────────────────────────────
  # Runs on the homelab MacBook's residential IP: Cloudflare's WAF in front of
  # graph.amctheatres.com blocks the app's request from GitHub's datacenter
  # IPs. The request itself is the AMC app's own (tools/amc/fetch.mjs).
  # Uploads amc.json + amc-films.json as an artifact for the collect job to
  # download and commit.
  amc-fetch:
    needs: [amc-gate]
    if: needs.amc-gate.outputs.run == 'true'
    runs-on: [self-hosted, linux, homelab, residential]
    permissions:
      contents: read
    # The fetch is continue-on-error, so the JOB succeeds either way; collect
    # reads this to turn an AMC failure back into a red run.
    outputs:
      fetch: ${{ steps.amc.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "AMC: fetch watch history"
        id: amc
        continue-on-error: true
        run: bun tools/amc/fetch.mjs
        env:
          AMC_SESSION: ${{ secrets.AMC_SESSION }}
          AMC_DEVICE_ID: ${{ secrets.AMC_DEVICE_ID }}
          AMC_ROTATED_COOKIE_FILE: ${{ runner.temp }}/amc-rotated

      # The cookie rotates on ANY response (including errors), so persist it
      # before checking whether the fetch itself succeeded.
      - name: "AMC: persist rotated cookie"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -s "$RUNNER_TEMP/amc-rotated" ]; then
            echo "Cookie did not rotate — nothing to persist."
            exit 0
          fi
          gh secret set AMC_SESSION --body "$(cat "$RUNNER_TEMP/amc-rotated")"
          rm -f "$RUNNER_TEMP/amc-rotated"

      - name: "AMC: enrich film metadata"
        if: always() && steps.amc.outcome == 'success'
        continue-on-error: true
        run: bun tools/amc/enrich.mjs

      - name: Upload AMC data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amc-data
          path: |
            src/data/amc.json
            src/data/amc-films.json
          retention-days: 1
          if-no-files-found: ignore

  # ── Collect (ubuntu-latest) ──────────────────────────────────────────────
  collect:
    needs: [amc-gate, amc-fetch]
    # Run even when amc-fetch is skipped (non-Monday) or fails (runner offline).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit and push the refreshed data
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Download the AMC data that the self-hosted runner produced.
      - name: "AMC: download data from self-hosted runner"
        if: needs.amc-fetch.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: amc-data
          path: .

      # ── BayWheels ──────────────────────────────────────────────────────────
      # The query action lives in the private tatimblin/baywheels-stats repo and
      # is checked out at run time. Its csv-output action is NOT used: it commits
      # and pushes on its own, and this workflow makes one commit. Its "Write CSV
      # row" upsert is inlined below instead.
      - name: "BayWheels: checkout actions"
        id: bw_checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: tatimblin/baywheels-stats
          token: ${{ secrets.GH_PAT }}
          path: .github/actions/baywheels-stats

      # Mobile OAuth path: query-stats mints an access token from the durable
      # refresh token and persists the rotated token back to secrets itself, so
      # no separate browser refresh step is needed.
      - name: "BayWheels: query statistics"
        id: bw_query
        if: steps.bw_checkout.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/baywheels-stats/query-stats
        with:
          github_token: ${{ secrets.GH_PAT }}
        env:
          LYFT_CLIENT_BASIC: ${{ secrets.LYFT_CLIENT_BASIC }}
          LYFT_REFRESH_TOKEN: ${{ secrets.LYFT_REFRESH_TOKEN }}
          LYFT_DEVICE_HEADERS: ${{ secrets.LYFT_DEVICE_HEADERS }}
          # Fallback for the browser cookie flow if mobile secrets are unset.
          BAYWHEELS_COOKIES: ${{ secrets.BAYWHEELS_COOKIES }}

      # Stale-read guard, then the upsert from baywheels-stats/csv-output: one row
      # per date (re-running a date refreshes it), kept sorted by date.
      - name: "BayWheels: guard and write CSV row"
        id: baywheels
        if: steps.bw_query.outcome == 'success'
        continue-on-error: true
        env:
          RIDES: ${{ steps.bw_query.outputs.number_of_rides }}
          DISTANCE: ${{ steps.bw_query.outputs.total_distance }}
          TIME: ${{ steps.bw_query.outputs.total_time }}
        run: |
          if [ -z "$RIDES" ] || [ "$RIDES" = "null" ]; then
            echo "::error::Stats query returned no ride count - auth likely broken. Not committing."
            exit 1
          fi
          echo "Ride count: $RIDES"

          FILE="$DATA_BIKE"
          DATE="$(date +'%Y-%m-%d')"
          ROW="$DATE,$RIDES,$DISTANCE,$TIME"
          mkdir -p "$(dirname "$FILE")"
          [ -s "$FILE" ] || echo "date,rides,distance,duration" > "$FILE"
          tmp="$(mktemp)"
          {
            head -n 1 "$FILE"
            { tail -n +2 "$FILE" | grep -v "^${DATE},"; echo "$ROW"; } | sort -t, -k1,1
          } > "$tmp"
          mv "$tmp" "$FILE"

      # ── GitHub ─────────────────────────────────────────────────────────────
      # Fetches the contribution calendar + top languages (incl. private repos)
      # via the GitHub GraphQL API. The script exits non-zero if the calendar is
      # empty (stale-auth guard), so a broken token never commits an empty widget.
      - name: "GitHub: fetch stats"
        id: github
        continue-on-error: true
        run: bun tools/github-stats/fetch.mjs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      # ── Pageviews ──────────────────────────────────────────────────────────
      # Reads hosted GoatCounter's per-day visitors (site-wide and per post/demo)
      # and MERGES them into pageviews.json, which the readers widget, the post
      # strip and /txt read at build time. (It replaced the Cloudflare Web
      # Analytics readers fetch, whose sampled figures were unusable.) Re-reads the last 45 days; an empty ledger (the first
      # run) backfills from 2026-07-01, and a manual run can re-read from any
      # date with the pageviews_since input. Exits non-zero on an API error or
      # an empty window once the ledger is a week old (stale-auth guard).
      # GOATCOUNTER_TOKEN is a read-only API key.
      - name: "Pageviews: fetch"
        id: pageviews
        continue-on-error: true
        run: bun tools/pageviews/fetch.mjs
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
          PAGEVIEWS_SINCE: ${{ inputs.pageviews_since }}

      # ── Volo ───────────────────────────────────────────────────────────────
      # Scheduled runs fetch Volo on Wednesday and Thursday (UTC) only, as the old
      # '0 14 * * 3,4' cron did. Every game so far has been on a Tuesday evening
      # Pacific, so Wednesday picks up the night's results. Thursday is the
      # backstop: late-entered scores, a failed Wednesday run, a Wednesday league.
      # Manual runs always fetch.
      - name: "Volo: is today a Volo day?"
        id: volo_day
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          DOW="$(date -u +%u)"
          if [ "$FORCE" = "true" ] || [ "$DOW" = 3 ] || [ "$DOW" = 4 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Day $DOW is not Wednesday or Thursday; skipping Volo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Trades VOLO_REFRESH_TOKEN for a short-lived access token, then pulls every
      # season's schedule and scores. Exits non-zero if no season has a single
      # recorded result (stale-auth guard, since scores are PLAYER-only).
      - name: "Volo: fetch seasons"
        id: volo
        if: steps.volo_day.outputs.run == 'true'
        continue-on-error: true
        run: bun tools/volo/fetch.mjs
        env:
          VOLO_REFRESH_TOKEN: ${{ secrets.VOLO_REFRESH_TOKEN }}
          VOLO_ROTATED_TOKEN_FILE: ${{ runner.temp }}/volo-rotated

      # Volo rotates the refresh token on every use (verified), so the secret must
      # be replaced or tomorrow's run authenticates with a dead credential. The
      # fetch script only writes this file when the returned token differs from
      # the one sent. This runs whether or not the fetch succeeded, because the
      # rotation happens before the data query — a rotated token must be
      # persisted even if the query then failed.
      - name: "Volo: persist rotated refresh token"
        id: volo_token
        if: always() && steps.volo_day.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -s "$RUNNER_TEMP/volo-rotated" ]; then
            echo "Refresh token did not rotate — nothing to persist."
            exit 0
          fi
          gh secret set VOLO_REFRESH_TOKEN --body "$(cat "$RUNNER_TEMP/volo-rotated")"
          rm -f "$RUNNER_TEMP/volo-rotated"

      # ── One commit ─────────────────────────────────────────────────────────
      # Every fetcher writes its file only after its guard passes, so a failed
      # one leaves nothing behind to discard.
      - name: Commit and push if changed
        id: commit
        run: |
          # -I ignores Volo's `updated` stamp, which the fetch rewrites on every
          # run: a diff that touches only it is not new data.
          if git diff --quiet -I'^[[:space:]]*"updated": ' -- "$DATA_VOLO"; then
            git checkout -- "$DATA_VOLO"
          fi
          if git diff --quiet -I'^[[:space:]]*"updated": ' -- "$DATA_AMC"; then
            git checkout -- "$DATA_AMC"
          fi

          git add -- "$DATA_BIKE" "$DATA_GITHUB" "$DATA_PAGEVIEWS" "$DATA_VOLO" "$DATA_AMC" "$DATA_AMC_FILMS"
          if git diff --cached --quiet; then
            echo "No data changed — nothing to commit or deploy."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update nightly data - $(date +%F)"
          # Retry once on top of anything pushed to the branch during the run.
          git push || { git pull --rebase && git push; }
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The fetchers are continue-on-error so one broken credential doesn't block
      # the others' data; this turns any such failure back into a red run.
      - name: Fail if any fetcher failed
        if: contains(steps.*.outcome, 'failure') || needs.amc-fetch.outputs.fetch == 'failure'
        run: exit 1

  deploy:
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.committed == 'true' && github.ref == 'refs/heads/master' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-deploy.yml
    with:
      ref: ${{ needs.collect.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
