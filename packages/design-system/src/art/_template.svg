<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <!--
    THE STARTING FILE for an art plate. Copy it, replace the drawing, keep
    the rules. The frame (ArtFrame) supplies the plate, the edge and the
    corner: draw nothing behind the shapes. Comments are stripped on render.

    GRID. viewBox 0 0 320 180, a 10-unit grid: sit points on multiples of 10
    (isometric edges land off it; that is fine). The frame CLIPS, so shapes
    are expected to run out of frame — at least one element crosses an edge.

    SAFE AREA. Inset 16 on every side (x 16..304, y 16..164): nothing that
    must be read lives outside it, but crops through it are the language.

    COLOUR. fill and stroke may be none, currentColor or one of
    var(--art-ink) var(--art-ink-2) var(--art-lavender) var(--art-coral)
    var(--art-cyan) var(--art-green). No hex, no rgb, no names, no opacity
    attributes: --art-ink-2 is the one dimming (grids, dashed paths, ghosts).
    The ink plus at most THREE of the four colours per file; one dominates.

    LINES. Every stroked shape carries vector-effect="non-scaling-stroke", so
    the line is 1px on screen at any size. Weight by class: art-line (1, the
    default) or art-line--2 (1.5, one emphasis outline, rarely). Round caps
    and joins for organic paths; square (the default) for circuit traces.
    Dashes 4 4 or 2 6. Terminal dots on a trace r 2.5; scattered dots r 1.5-3.

    ISOMETRIC. True 30 degrees: right axis (0.866, 0.5), left (-0.866, 0.5),
    up (0, -1). Top face --art-ink; sides one fill colour, or the plate
    (fill none) with an ink outline. A cylinder's ellipse has ry = rx / 2.

    MOTION. Optional, and at most ONE group per file: set data-motion on a
    <g> to one of spin, drift, slide, blink, dash, and data-speed to 0.5, 1
    or 2. The frame owns the keyframes; the group only holds what moves. The
    still frame is the poster, so the drawing must read with nothing moving.
    A slide repeats every 40 units and moves left by 40; a dash advances its
    4 4 or 2 6 pattern by one period; a blink dims to lit again.

    TYPE. Optional words, in caps, in a VOICE: <text class="art-label |
    art-caption | art-numeral | art-title" x y font-size text-anchor fill>.
    font-size is on the scale 3.5 4.5 6 9 14 22 32 (viewBox units; label
    3.5-6, caption 3.5-4.5, title 6-14, numeral 9-32); the class sets the
    face, so no font-family, weight, letter-spacing or style.

    BUDGET. At most 120 elements, 20 KB, 3 clipPaths, groups 4 deep. No
    style, no gradients, no filters, no images, no ids except a clipPath's,
    prefixed with the file's slug.
  -->
  <g>
    <!-- A trace in from the left edge, two right-angle bends, a terminal. -->
    <path d="M -10 60 H 70 V 100 H 130" fill="none" stroke="var(--art-ink)" class="art-line" vector-effect="non-scaling-stroke" />
    <circle cx="130" cy="100" r="2.5" fill="var(--art-ink)" />
    <!-- A dashed, organic path from the terminal to the box. -->
    <path d="M 130 100 C 160 100 160 130 190 120" fill="none" stroke="var(--art-ink-2)" stroke-dasharray="4 4" stroke-linecap="round" class="art-line" vector-effect="non-scaling-stroke" />
    <!-- An isometric box, cropped through the bottom edge: top face in ink,
         right face lavender, left face the plate with an ink outline. -->
    <path d="M 230 70 L 273.3 95 L 230 120 L 186.7 95 Z" fill="var(--art-ink)" />
    <path d="M 273.3 95 L 273.3 165 L 230 190 L 230 120 Z" fill="var(--art-lavender)" />
    <path d="M 186.7 95 L 230 120 L 230 190 L 186.7 165 Z" fill="none" stroke="var(--art-ink)" class="art-line" vector-effect="non-scaling-stroke" />
    <!-- Rings through the top-right corner, in the dim ink. -->
    <circle cx="290" cy="20" r="14" fill="none" stroke="var(--art-ink-2)" class="art-line" vector-effect="non-scaling-stroke" />
    <circle cx="290" cy="20" r="26" fill="none" stroke="var(--art-ink-2)" class="art-line" vector-effect="non-scaling-stroke" />
    <circle cx="290" cy="20" r="38" fill="none" stroke="var(--art-ink-2)" class="art-line" vector-effect="non-scaling-stroke" />
    <!-- Scattered dots, in the second colour. -->
    <circle cx="60" cy="30" r="3" fill="var(--art-coral)" />
    <circle cx="100" cy="150" r="2" fill="var(--art-coral)" />
    <circle cx="150" cy="40" r="1.5" fill="var(--art-ink)" />
  </g>
</svg>
